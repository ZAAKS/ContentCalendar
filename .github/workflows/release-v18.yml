name: Release V18

# Manual only: Actions → Release V18 → Run workflow, then enter the version.
# Publishes ContentCalendar.V18 (Umbraco 18) to nuget.org and creates the tag and GitHub release
# ContentCalendar.V18-<version>. The steps live in release-package.yml.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'ContentCalendar.V18 version to publish (for example 1.0.0 or 1.1.0-beta.1)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

concurrency:
  group: release-v18
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/release-package.yml
    with:
      edition: '18'
      version: ${{ inputs.version }}
    secrets:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
