name: Release V17

# Manual only: Actions → Release V17 → Run workflow, then enter the version.
# Publishes ContentCalendar.V17 (Umbraco 17) to nuget.org and creates the tag and GitHub release
# ContentCalendar.V17-<version>. The steps live in release-package.yml.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'ContentCalendar.V17 version to publish (for example 1.0.1 or 1.1.0-beta.1)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-v17
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/release-package.yml
    with:
      edition: '17'
      version: ${{ inputs.version }}
    secrets:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
