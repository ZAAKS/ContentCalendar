name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/ContentCalendar.Backoffice/Client/package-lock.json

      - name: Install client dependencies
        working-directory: src/ContentCalendar.Backoffice/Client
        run: npm ci --no-audit --no-fund

      # Builds the shared backoffice client (npm run build) once and copies it into both editions.
      - name: Build
        run: dotnet build ContentCalendar.sln -c Release

      - name: Pack
        run: |
          dotnet pack src/ContentCalendar.V17/ContentCalendar.V17.csproj -c Release -o ./artifacts
          dotnet pack src/ContentCalendar.V18/ContentCalendar.V18.csproj -c Release -o ./artifacts

      # The client compiles against the lowest supported backoffice (17); also type-check it against 18.
      - name: Type-check client against Umbraco 18 backoffice
        working-directory: src/ContentCalendar.Backoffice/Client
        run: |
          npm i --no-save --no-audit --no-fund "@umbraco-cms/backoffice@^18"
          npm run typecheck

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./artifacts/*
          retention-days: 7
