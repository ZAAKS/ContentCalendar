name: Copilot code review

# Requests a review from GitHub Copilot on every pull request (not drafts) to main.
# Review guidance for Copilot lives in .github/copilot-instructions.md.
# pull_request_target so PRs from forks get a write token too; safe because no PR code is checked out or run.
on:
  pull_request_target:
    branches: [ main ]
    types: [ opened, reopened, ready_for_review ]

permissions:
  pull-requests: write

jobs:
  request-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Request Copilot review
        env:
          # Optional COPILOT_REVIEW_TOKEN: a token of a user with a Copilot licence, used when the
          # workflow token is not allowed to request Copilot reviews.
          GH_TOKEN: ${{ secrets.COPILOT_REVIEW_TOKEN || github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-reviewer "@copilot"
